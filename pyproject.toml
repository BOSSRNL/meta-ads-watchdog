[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-ads-watchdog"
version = "1.0.0"
description = "Auto-pauses overspending Meta ad campaigns, flags possible account hacks, and switches to sale-day mode on paydays and double-day sales."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BOSSRNL" }]
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32.4",
  "python-dotenv>=1.0",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
meta-ads-watchdog = "meta_ads_watchdog.cli:main"

[project.urls]
Homepage = "https://github.com/BOSSRNL/meta-ads-watchdog"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["meta_ads_watchdog"]
branch = true
